
<div class=" list-group-item d-flex justify-content-between align-items-center
" [class.bg-warning]="!pizza().vegetarian">
    
    <img [src]="pizza().image" alt="photo" width="50" height="50" class="rounded-circle">
    <span class="badge text-bg-dark m-4 ">{{pizza().name}}</span>
     @if(pizza().vegetarian){
        <span class="text-success fw-bold">pizza vegeterienne</span>
    }
   <span>prix:{{pizza().price}}</span>
   <button  (click)="supprimerPizza()" class="btn btn-dark">Supprimer</button>
   <a href="#">afficher les commentaires</a> 
</div>
